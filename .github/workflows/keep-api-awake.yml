# Lightweight ping so Render does not sleep between the heavy health-check job.
# GitHub cron can drift; the app also wakes /health before Coach/Ask.
name: Keep API awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping Render health
        run: curl -fsS --retry 2 --retry-delay 8 --max-time 90 https://send-it-ke7r.onrender.com/health
