# Lightweight ping so Render does not sleep between the heavy health-check job.
# GitHub cron can drift; the app also wakes /health before Coach/Ask.
name: Keep API awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Render health
        run: >
          curl -fsS
          --retry 12
          --retry-all-errors
          --retry-delay 5
          --retry-max-time 180
          --max-time 30
          https://send-it-ke7r.onrender.com/health
